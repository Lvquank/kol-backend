services:
  postgres:
    image: postgres:16-alpine
    container_name: kol-postgres
    restart: always
    environment:
      POSTGRES_DB: kol
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
